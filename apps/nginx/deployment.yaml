apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: gitops-demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: gitops-demo

spec:
  replicas: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: nginx

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20